<header class="header">
  <div class="logo">
    Bilion<span class="accent">.</span>
  </div>

  <div class="links-wrapper">
    <nav class="nav-links">
      <a href="#about">{{ 'header.nav.about' | translate }}</a>
      <a href="#skills">{{ 'header.nav.skills' | translate }}</a>
      <a href="#portfolio">{{ 'header.nav.portfolio' | translate }}</a>
    </nav>

    <div class="lang-switch">
      <button class="lang-btn" [class.active]="currentLang() === 'en'" (click)="switchLanguage('en')">EN</button>
      <button class="lang-btn" [class.active]="currentLang() === 'de'" (click)="switchLanguage('de')">DE</button>
    </div>
  </div>
</header>
