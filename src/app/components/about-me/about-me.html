<section id="about" class="about-section">
  <div class="about-wrapper">
    <div class="about-content">
      <h2 class="about-title" data-aos="fade-right">{{ "header.nav.about" | translate }}</h2>

      <p class="about-description" data-aos="fade-up" data-aos-delay="100">
        {{ "about_me.description" | translate }}
      </p>

      <ul class="about-features">
        <li class="feature-item" data-aos="fade-up" data-aos-delay="200">
          <div class="feature-icon">
            <img src="icons/location.svg" alt="Location">
          </div>
          <p class="feature-text">
            {{ "about_me.featureTextLocation" | translate }}
          </p>
        </li>

        <li class="feature-item" data-aos="fade-up" data-aos-delay="300">
          <div class="feature-icon">
            <img src="icons/mindset.svg" alt="Mindset">
          </div>
          <p class="feature-text">
            {{ "about_me.featureTextMindset" | translate }}
          </p>
        </li>

        <li class="feature-item" data-aos="fade-up" data-aos-delay="400">
          <div class="feature-icon">
            <img src="icons/puzzle.svg" alt="Problem solving">
          </div>
          <p class="feature-text">
            {{ "about_me.featureTextProblemSolving" | translate }}
          </p>
        </li>
      </ul>
    </div>

    <div class="about-visual" data-aos="fade-left" data-aos-delay="100">
      <div class="profile-circle-frame">
        <div class="img-container">
          <img src="./images/my-hero-photo-removebg-preview.png" alt="Ievgen Bilion" class="profile-avatar">
        </div>
        <div class="decorative-line"></div>
      </div>
    </div>

  </div>
  <div class="bg-blur bg-blur-1"></div>
</section>
