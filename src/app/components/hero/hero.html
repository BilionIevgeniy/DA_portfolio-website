<section class="hero-section">
  <div class="container">
    <div class="hero-main-flex">

      <div class="hero-photo-wrapper">
        <div class="content"></div>
        <img src="./images/hero.png" alt="Ievgen Bilion" class="hero-photo">
        <div class="bg-blur bg-blur-2"></div>
      </div>

      <div class="hero-text-content">
        <div class="hero-title-group">
          <span [style.font-size.px]="verticalTextSize()" class="vertical-text">{{"hero.verticalText" |
            translate}}</span>
          <div class="hero-title-content">
            <h1 class="hero-title">Ievgen Bilion</h1>
            <h2 class="hero-subtitle">{{"hero.subtitle" | translate}}</h2>
          </div>
        </div>
        <a href="#contact" class="button">{{"hero.ctaButton" | translate}}</a>
      </div>
    </div>

    <a href="#contact" class="scroll-label-rotated">
      <span>{{"hero.scrollLabel" | translate}}</span>
      <span class="arrow">→</span>
    </a>
  </div>

  <div class="hero-footer-bar">
    <div class="social-icons">
      <div class="left-line"></div>
      <a href="https://github.com/BilionIevgeniy" target="_blank">
        <img src="icons/github.svg" alt="GitHub">
      </a>
      <a href="https://www.linkedin.com/in/ievgen-bilion-434377192/" target="_blank">
        <img src="icons/linkedin.svg" alt="LinkedIn">
      </a>
      <a href="#contact"><img src="icons/email.svg" alt="LinkedIn"></a>
    </div>
  </div>

  <div class="bg-blur bg-blur-1"></div>

</section>
